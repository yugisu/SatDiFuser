# BigEarthNet — embedding / retrieval task (multi-label)
# Two samples are treated as a retrieval positive when they share ≥1 land-cover label.
# Pairs with _base_/satdifuser.yaml and _base_/diffusionsat.yaml.

dataset_name: 'mbigearthnet'
task: 'embedding'

num_classes: 43   # used for SupCon multi-label positive-pair mining
original_img_size: 120
img_size: 256
num_channels: 3

prompt: "A satellite image"
resize_outputs: -1

# ── Embedding head ────────────────────────────────────────────────────────────
embedding_dim: 256
normalize_embeddings: true

# ── Retrieval evaluation & loss ──────────────────────────────────────────────
# Used both by the VICReg invariance term (training) and the RetrievalEvaluator
# (validation).  BigEarthNet patches are 1200 m × 1200 m; 1000 m covers adjacent ones.
geo_positive_threshold_m: 1000

# ── VICReg loss weights ───────────────────────────────────────────────────────
vicreg_lambda: 25.0
vicreg_mu: 25.0
vicreg_nu: 1.0
vicreg_gamma: 1.0
